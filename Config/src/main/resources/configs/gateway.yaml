spring:
  cloud:
    gateway:
      routes:
        - id: school-service
          uri: lb://SCHOOL-SERVICE  # Use uppercase service name
          predicates:
            - Path=/schools/**
        - id: student-service
          uri: lb://STUDENT-SERVICE  # Use uppercase service name
          predicates:
            - Path=/students/**

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG